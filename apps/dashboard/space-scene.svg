    <path d="M1640 368c-203-77-239 105-389 166s-174 174-288 235" stroke="#8d789c" stroke-width="11"/>
  </g>
  <ellipse cx="430" cy="385" rx="510" ry="315" fill="url(#nebula-coral)"/>
  <ellipse cx="1270" cy="365" rx="465" ry="330" fill="url(#nebula-violet)"/>
  <ellipse cx="1040" cy="715" rx="420" ry="230" fill="url(#nebula-blue)"/>
  <g class="star-dots" fill="#fff1dc">

    <circle cx="472" cy="348" r="1.1"/><circle cx="542" cy="244" r="1.3"/><circle cx="619" cy="91" r="1.1"/>
    <circle cx="688" cy="321" r="1.2"/><circle cx="753" cy="253" r="1.1"/><circle cx="851" cy="365" r="1.4"/>
    <circle cx="978" cy="300" r="1.1"/><circle cx="1060" cy="337" r="1.4"/><circle cx="1154" cy="282" r="1.1"/>
    <circle cx="1240" cy="372" r="1.2"/><circle cx="1360" cy="318" r="1.1"/><circle cx="1485" cy="359" r="1.3"/>
    <circle cx="1584" cy="476" r="1.2"/><circle cx="78" cy="546" r="1.1"/><circle cx="214" cy="590" r="1.4"/>
    <circle cx="321" cy="574" r="1.1"/><circle cx="519" cy="625" r="1.2"/><circle cx="628" cy="601" r="1.1"/>
    <circle cx="802" cy="624" r="1.3"/><circle cx="914" cy="703" r="1.1"/><circle cx="1081" cy="590" r="1.2"/>
    <circle cx="1174" cy="760" r="1.1"/><circle cx="1261" cy="588" r="1.3"/><circle cx="1461" cy="565" r="1.1"/>
    <circle cx="1572" cy="812" r="1.4"/><circle cx="731" cy="822" r="1.1"/><circle cx="955" cy="119" r="1.2"/>
    <circle cx="1184" cy="86" r="1.1"/><circle cx="1466" cy="113" r="1.3"/><circle cx="53" cy="812" r="1.1"/>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#080e20"/>
      <stop offset=".58" stop-color="#0b1228"/>
      <stop offset="1" stop-color="#090f20"/>
    </linearGradient>
    <radialGradient id="haze">
      <stop stop-color="#26304f" stop-opacity=".64"/>
      <stop offset=".52" stop-color="#18213b" stop-opacity=".42"/>
      <stop offset="1" stop-color="#0b1228" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-coral">
      <stop stop-color="#ff796f" stop-opacity=".3"/>
      <stop offset=".48" stop-color="#bb567f" stop-opacity=".17"/>
      <stop offset="1" stop-color="#bb567f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-violet">
      <stop stop-color="#7669c5" stop-opacity=".28"/>
      <stop offset=".52" stop-color="#6259a4" stop-opacity=".14"/>
      <stop offset="1" stop-color="#6259a4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-blue">
      <stop stop-color="#58a5bc" stop-opacity=".2"/>
      <stop offset=".52" stop-color="#3f739c" stop-opacity=".1"/>
      <stop offset="1" stop-color="#3f739c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx=".72" cy=".23" r=".88">
      <stop stop-color="#ff9a81"/>
      <stop offset=".16" stop-color="#d8797d"/>
      <stop offset=".39" stop-color="#6a597d"/>
      <stop offset=".68" stop-color="#283b5d"/>
      <stop offset="1" stop-color="#101a32"/>
    </radialGradient>
    <radialGradient id="moon" cx=".78" cy=".27" r=".84">
      <stop stop-color="#27314a"/>
      <stop offset=".72" stop-color="#111a30"/>
      <stop offset="1" stop-color="#080e20"/>
    </radialGradient>
    <filter id="cloud" x="-.3" y="-.3" width="1.6" height="1.6">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .025" numOctaves="3" seed="14"/>
      <feDisplacementMap in="SourceGraphic" scale="42"/>
      <feGaussianBlur stdDeviation="19"/>
    </filter>
    <filter id="soft" x="-.4" y="-.4" width="1.8" height="1.8">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="glow" x="-.8" y="-.8" width="2.6" height="2.6">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="world"><circle cx="235" cy="1010" r="465"/></clipPath>
    <clipPath id="crescent"><circle cx="342" cy="157" r="91"/></clipPath>
  </defs>
  <style>
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes twinkle{0%,100%{opacity:.48;transform:scale(.72)}45%{opacity:1;transform:scale(1)}60%{opacity:.58;transform:scale(.82)}}
    .spin-world,.spin-moon,.spin-distant{transform-box:view-box;animation:spin 150s linear infinite}
    .spin-world{transform-origin:235px 1010px}
    .spin-moon{transform-origin:342px 157px;animation-duration:105s}
    .spin-distant{transform-origin:1400px 675px;animation-duration:210s}
    .star-dots circle{transform-box:fill-box;transform-origin:center;animation:twinkle 4.8s ease-in-out infinite}
    .star-dots circle:nth-child(3n){animation-delay:-2.1s;animation-duration:3.4s}
    .star-dots circle:nth-child(3n + 1){animation-delay:-1.2s;animation-duration:5.7s}
    .star-dots circle:nth-child(5n + 2){fill:#ffc0b8}
    .star-dots circle:nth-child(7n + 3){fill:#c4d4ff}
    .starbursts path{transform-box:fill-box;transform-origin:center;animation:twinkle 3.8s ease-in-out infinite}
    .starbursts path:nth-child(even){animation-delay:-1.7s;animation-duration:4.6s}
    @media(prefers-reduced-motion:reduce){.spin-world,.spin-moon,.spin-distant,.star-dots circle,.starbursts path{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
